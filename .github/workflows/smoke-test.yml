name: Smoke test pesquisa IA

on:
  push:
    paths:
      - '.github/workflows/smoke-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validar página pública
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSL 'https://thiagodownload.github.io/thiago-repository/' | grep -q 'Diagnóstico de'; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Enviar resposta de teste ao Supabase
        run: |
          TEST_PROTOCOL="SMOKE-${GITHUB_RUN_ID}"
          HTTP_CODE=$(curl -sS -o /tmp/response.txt -w '%{http_code}' \
            -X POST 'https://odthqhyzrmjwynwpsdoc.supabase.co/rest/v1/mundial_ia_responses' \
            -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_VLXCKSh3i4aMvhN00WvvxA_ZprUQxC5' \
            -H 'Prefer: return=minimal' \
            --data "{\"protocol\":\"${TEST_PROTOCOL}\",\"setor\":\"SMOKE_TEST\",\"situacao\":\"SMOKE_TEST\",\"payload\":{\"smoke_test\":true,\"source\":\"github_actions\"}}")
          cat /tmp/response.txt || true
          test "$HTTP_CODE" = "201" || test "$HTTP_CODE" = "204"
